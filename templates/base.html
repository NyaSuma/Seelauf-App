<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Seelauf App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{ url_for('main.index') }}">Seelauf App</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{{ url_for('main.index') }}">Startseite</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('zeitmesser.zeitmesser') }}">Zeitnehmer‑Interface</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('admin.login') }}">Admin Panel</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        {% block content %}{% endblock %}

        <!-- Versteckter Button und Bild -->
        <button id="secretBtn" style="position: fixed; bottom: 10px; right: 10px; width: 30px; height: 30px; opacity: 0.2; border: none; background: gray; border-radius: 50%; cursor: pointer; z-index: 9999; transition: opacity 0.3s;" onmouseover="this.style.opacity='0.5'" onmouseout="this.style.opacity='0.2'" title="Shhh..."></button>
        <div id="bubensahneOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 10000; justify-content: center; align-items: center;">
            <img id="bubensahneImg" src="{{ url_for('static', filename='images/Bubensahne.jpg') }}" style="max-width: 90%; max-height: 90%; object-fit: contain;">
        </div>

        <script>
            document.getElementById('secretBtn').addEventListener('click', function() {
                var overlay = document.getElementById('bubensahneOverlay');
                overlay.style.display = 'flex';
                
                setTimeout(function() {
                    overlay.style.display = 'none';
                }, 3000);
            });
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
    
    </html>
