{% extends "base.html" %}
{% block title %}Zeitmesser - Seelauf App{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/zeitmesser.css') }}">
{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <h1>⏱️ Zeitmesser</h1>
                <p class="text-muted">Messen Sie Ihre Trainingszeit</p>
            </div>
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="display-4 text-monospace" id="timeDisplay">00:00:00.00</div>
                    <div id="statusDisplay" class="mb-3 text-center fw-medium">Bereit</div>
                    <div class="d-grid gap-2">
                        <button class="btn btn btn-success" id="startBtn" onclick="startTimer()">Start</button>
                        <button class="btn btn btn-warning" id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
                        <button class="btn btn btn-danger" id="resetBtn" onclick="resetTimer()">Zurücksetzen</button>
                    </div>
                    <div class="mt-4">
                        <div class="input-group">
                            <input type="text" class="form-control" id="numberInput" placeholder="Nummer eingeben" aria-label="Nummer" disabled>
                            <button class="btn btn-primary" id="lapBtn" onclick="recordMeasurement()" disabled>Speichern</button>
                        </div>
                    </div>
                    <hr class="my-4">
                    <h5>Gemessene Zeiten</h5>
                    <div id="lapsList" class="mt-2">
                        <div class="text-muted">Keine Messungen erfasst</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/zeitmesser.js') }}"></script>
{% endblock %}
