{% extends "base.html" %}
{% block title %}Formular GET - Seelauf App{% endblock %}
{% block content %}
<div class="container py-4">
    <h1 class="mb-4">Formular GET Beispiel</h1>
    <p class="text-muted">Dies ist ein Platzhalter für ein GET-Formular.</p>
    <form action="/read" method="get" class="row g-3">
        <div class="col-md-4">
            <label for="attribut1" class="form-label">Attribut 1</label>
            <input type="text" class="form-control" id="attribut1" name="attribut1" placeholder="att1">
        </div>
        <div class="col-md-4">
            <label for="attribut2" class="form-label">Attribut 2</label>
            <input type="text" class="form-control" id="attribut2" name="attribut2" placeholder="att2">
        </div>
        <div class="col-md-4">
            <label for="attribut3" class="form-label">Attribut 3</label>
            <input type="text" class="form-control" id="attribut3" name="attribut3" placeholder="att3">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">DB-Operation</button>
        </div>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/formular_get.js') }}"></script>
{% endblock %}
